name: Smoke Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline smoke tests
        # 不需要任何 LLM API key——只测 schemas/loader/chunker/
        # skills_writer/triple_verification/renderer 的离线逻辑
        run: python -m tests.smoke_test

      - name: Verify imports (no API key)
        run: |
          python -c "from persona_distillation import PersonaDistiller, DistillationConfig, MentalModel, ExpressionDNA, verify_mental_models; print('imports OK')"
          python -c "from persona_distillation.agents import build_orchestrator, build_subagents; print('agents module OK')"
